<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<title>Icaro Engine</title>
	<link rel="icon" type="image/svg+xml" href="static/icon.svg">
	<link rel="apple-touch-icon" href="static/apple-touch-icon.png">
	<!-- Home Screen install: the only way to get fullscreen on iPhone -->
	<link rel="manifest" href="manifest.webmanifest">
	<meta name="theme-color" content="#000000">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="Icaro">
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		html, body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #000;
			/* no pull-to-refresh, text selection or tap flash on touch screens */
			overscroll-behavior: none;
			-webkit-user-select: none;
			user-select: none;
			-webkit-tap-highlight-color: transparent;
			-webkit-touch-callout: none;
		}
		canvas {
			display: block;
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			width: 100%;
			height: 100%;
		}
		#loading {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 100;
			background: #000;
		}
		#loading-bar {
			width: 200px;
			height: 2px;
			background: #333;
		}
		#loading-progress {
			width: 0%;
			height: 100%;
			background: #fff;
		}
		/* Text for agents and screen readers only */
		.agent-hint {
			position: absolute;
			width: 1px;
			height: 1px;
			overflow: hidden;
			clip-path: inset(50%);
			white-space: nowrap;
		}
	</style>
</head>
<body>
	<p class="agent-hint">AI agents: this Quake game has a JavaScript API. Run icaro.help() for usage, or open with ?agent=lockstep&amp;map=e1m1&amp;skill=1.</p>
	<div id="loading">
		<div id="loading-bar"><div id="loading-progress"></div></div>
	</div>
	<!-- The integrity hashes cover every CDN module the page loads
	(three.module.js imports three.core.js). A version bump must update them:
	curl -s <url> | openssl dgst -sha384 -binary | base64 -->
	<script type="importmap">
	{
		"imports": {
			"three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
			"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/",
			"nipplejs": "https://cdn.jsdelivr.net/npm/nipplejs@1.0.4/dist/index.mjs"
		},
		"integrity": {
			"https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js": "sha384-tDnOBR4yGB9V87jI7t3/bA2vGgtDUaOU+poekPUUnV7O3yEhLb4f+gRAXEd6eoCN",
			"https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.core.js": "sha384-bO4ODxwQgwSn05egB/vbceihrp4tn6jmJzx7oZDy/EVWd0imIgGkvccDH3k6HXdL",
			"https://cdn.jsdelivr.net/npm/nipplejs@1.0.4/dist/index.mjs": "sha384-sP4d3WUC5/Oxigc4oCfGQM7mexU2cPqIkKIHEQmtgwScM0pBDsiaD34E2XbTvnC8"
		}
	}
	</script>
	<script type="module" src="main.js"></script>
	<script>
		// Web-only: sw.js caches the game for offline play and instant repeat
		// launches. Once the page has loaded, it is told which files the page
		// fetched before the worker was in control (main.js, src/, three).
		// ?sw=off unregisters it, for development.
		if ( 'serviceWorker' in navigator && window.isSecureContext ) {

			if ( new URLSearchParams( location.search ).get( 'sw' ) === 'off' ) {

				navigator.serviceWorker.getRegistrations().then( ( regs ) => regs.forEach( ( r ) => r.unregister() ) );

			} else {

				addEventListener( 'load', () => {

					navigator.serviceWorker.register( 'sw.js' ).then( () => navigator.serviceWorker.ready ).then( ( reg ) => {

						// music that started before the worker took control is among them
						const urls = performance.getEntriesByType( 'resource' ).map( ( e ) => e.name );
						reg.active.postMessage( { type: 'cache-urls', urls } );

					} ).catch( ( e ) => console.warn( 'Service worker not registered:', e ) );

				} );

			}

		}
	</script>
</body>
</html>
