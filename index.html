	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		html, body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #000;
			/* no pull-to-refresh, text selection or tap flash on touch screens */
			overscroll-behavior: none;
			-webkit-user-select: none;
			user-select: none;
			-webkit-tap-highlight-color: transparent;
			-webkit-touch-callout: none;
		}
		canvas {
			display: block;
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			width: 100%;
			height: 100%;
		}

		/* The touch game controls are up: ENTER VR would cover the status bar */
		body.touch-playing #xr-enter {
			display: none;
		}

		#loading {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 100;
			background: #000;
		}
		#loading-bar {
			width: 200px;
			height: 2px;
			background: #333;
		}
		#loading-progress {
			width: 0%;
			height: 100%;
			background: #fff;
		}
		/* Text for agents and screen readers only */
		.agent-hint {
			position: absolute;
			width: 1px;
			height: 1px;
			overflow: hidden;
			clip-path: inset(50%);
			white-space: nowrap;
		}

	<script type="module" src="main.js"></script>
	<script>
		// Web-only: sw.js caches the game for offline play and instant repeat
		// launches. Once the page has loaded, it is told which files the page
		// fetched before the worker was in control (main.js, src/, three,
		// music).
		// ?sw=off unregisters it, for development.
		if ( 'serviceWorker' in navigator && window.isSecureContext ) {

			if ( new URLSearchParams( location.search ).get( 'sw' ) === 'off' ) {

				navigator.serviceWorker.getRegistrations().then( ( regs ) => regs.forEach( ( r ) => r.unregister() ) );

			} else {

				addEventListener( 'load', () => {

					navigator.serviceWorker.register( 'sw.js' ).then( () => navigator.serviceWorker.ready ).then( ( reg ) => {

						const urls = performance.getEntriesByType( 'resource' ).map( ( e ) => e.name );
						reg.active.postMessage( { type: 'cache-urls', urls } );

					} ).catch( ( e ) => console.warn( 'Service worker not registered:', e ) );

				} );

			}

		}
	</script>
