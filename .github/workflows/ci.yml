name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Deno is pinned in .tool-versions: a newer Deno can add recommended lint
      # rules and fail CI with no code change. Bump deliberately.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .tool-versions
          cache: true

      # Tests read static/pak0.pak (shareware, committed).
      - name: Test
        run: deno task test

      - name: Lint
        run: deno task lint

      - name: Type check
        run: deno task check
