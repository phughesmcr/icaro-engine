name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pinned: a newer Deno can add recommended lint rules and fail CI with
      # no code change. Bump deliberately.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.8

      # Tests read static/pak0.pak (shareware, committed).
      - name: Test
        run: deno task test

      - name: Lint
        run: deno task lint

      - name: Type check (client)
        run: deno check main.js

      - name: Type check (server)
        run: deno check server/game_server.js server/lobby_server.js server/room_process_manager.ts
