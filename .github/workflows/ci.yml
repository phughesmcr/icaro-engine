name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Deno is pinned in .tool-versions: a newer Deno can add recommended lint
      # rules and fail CI with no code change. Bump deliberately.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .tool-versions
          cache: true

      # Game data must never be committed: the repository tracks no pak at
      # all (LibreQuake is fetched, see below).
      - name: No pak tracked
        run: |
          if git ls-files -z | tr '\0' '\n' | grep -i '\.pak$'; then
            echo "::error::No .pak may be committed"
            exit 1
          fi

      # deno.json's fmt block sets the layout; run `deno fmt` before committing.
      - name: Format
        run: deno fmt --check

      # LibreQuake (deno task fetch-data, into the gitignored
      # static/librequake/). The release zip is cached under the SHA-256
      # pinned in src/librequake.js (LQ_RELEASES); the fetch checks it either
      # way and unpacks it.
      - name: LibreQuake pin
        id: librequake
        run: |
          sha256=$(deno run --no-prompt tools/fetch_data.js --print-sha)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: static/librequake/v0.09-beta/full.zip
          key: librequake-${{ steps.librequake.outputs.sha256 }}

      - name: Fetch LibreQuake
        run: deno task fetch-data

      # Tests read LibreQuake from static/librequake/id1/ (fetched above).
      - name: Test
        run: deno task test

      - name: Lint
        run: deno task lint

      - name: Type check
        run: deno task check

  # The game-room image (server/Dockerfile) must hold no .pak but the two of
  # LibreQuake that it fetches itself while building (so it needs no cached
  # zip): registered and rerelease data must never reach an image. Docker is
  # preinstalled on the runner. Nothing is pushed.
  container-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the game-room image
        run: sh tools/check_container_image.sh
